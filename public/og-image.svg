<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#11111a"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="80%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#cyanGlow)"/>
  <rect width="1200" height="630" fill="url(#purpleGlow)"/>

  <!-- Border -->
  <rect x="24" y="24" width="1152" height="582" rx="28" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <rect x="24" y="24" width="1152" height="582" rx="28" fill="none" stroke="url(#neonGrad)" stroke-width="1.5" stroke-dasharray="20 10" opacity="0.6"/>

  <!-- Terminal Icon Box -->
  <rect x="80" y="80" width="72" height="72" rx="18" fill="url(#neonGrad)"/>
  <path d="M102 104 L114 116 L102 128" fill="none" stroke="#0a0a0f" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="120" y1="128" x2="132" y2="128" stroke="#0a0a0f" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Status pill -->
  <rect x="172" y="94" width="230" height="44" rx="22" fill="rgba(0, 240, 255, 0.1)" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1.5"/>
  <circle cx="196" cy="116" r="6" fill="#00f0ff"/>
  <text x="214" y="122" fill="#00f0ff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" letter-spacing="1">MERN STACK DEVELOPER</text>

  <!-- Title / Name -->
  <text x="80" y="240" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" letter-spacing="-1">JEYA SURYA M</text>
  <text x="80" y="300" fill="#00f0ff" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="600">Full Stack &amp; MERN Stack Engineer • 2.6+ Years Experience</text>

  <!-- Tagline / Summary -->
  <text x="80" y="360" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">
    Architecting scalable, high-performance web applications, responsive user interfaces,
  </text>
  <text x="80" y="392" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">
    and robust REST APIs with modern full-stack architectures.
  </text>

  <!-- Tech Stack Pills -->
  <g transform="translate(80, 460)">
    <!-- React -->
    <rect x="0" y="0" width="110" height="42" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(0,240,255,0.4)" stroke-width="1"/>
    <text x="55" y="26" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="600">React.js</text>

    <!-- Next.js -->
    <rect x="122" y="0" width="110" height="42" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(0,240,255,0.4)" stroke-width="1"/>
    <text x="177" y="26" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Next.js</text>

    <!-- NestJS -->
    <rect x="244" y="0" width="110" height="42" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(0,240,255,0.4)" stroke-width="1"/>
    <text x="299" y="26" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="600">NestJS</text>

    <!-- Node.js -->
    <rect x="366" y="0" width="110" height="42" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(0,240,255,0.4)" stroke-width="1"/>
    <text x="421" y="26" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Node.js</text>

    <!-- TypeScript -->
    <rect x="488" y="0" width="130" height="42" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(0,240,255,0.4)" stroke-width="1"/>
    <text x="553" y="26" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="600">TypeScript</text>

    <!-- PostgreSQL -->
    <rect x="630" y="0" width="136" height="42" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(0,240,255,0.4)" stroke-width="1"/>
    <text x="698" y="26" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="600">PostgreSQL</text>

    <!-- Prisma -->
    <rect x="778" y="0" width="100" height="42" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(0,240,255,0.4)" stroke-width="1"/>
    <text x="828" y="26" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Prisma</text>

    <!-- MySQL -->
    <rect x="890" y="0" width="100" height="42" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(0,240,255,0.4)" stroke-width="1"/>
    <text x="940" y="26" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="600">MySQL</text>
  </g>

  <!-- Location & Availability footer -->
  <text x="80" y="556" fill="#64748b" font-family="system-ui, sans-serif" font-size="16">
    Chennai, India • Available for Full Stack &amp; Frontend Engineering Roles
  </text>
  <text x="1120" y="556" text-anchor="end" fill="#00f0ff" font-family="system-ui, sans-serif" font-size="16" font-weight="600">
    jeyasurya.vercel.app
  </text>
</svg>

